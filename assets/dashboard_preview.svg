      .text-green { fill: #3fb950; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .metric-val { font-size: 22px; font-weight: 700; fill: #ffffff; }
